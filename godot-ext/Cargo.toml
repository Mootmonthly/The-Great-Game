[package]
name = "great_game_ext"
description = "Godot GDExtension exposing the simulation to the game client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sim-core = { path = "../sim-core" }
godot = { version = "0.5.5", features = ["api-4-6"] }
serde_json = "1"
